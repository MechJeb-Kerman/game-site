<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>贪吃蛇 - 趣玩小游戏</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;padding:10px;
    background:radial-gradient(circle at 50% 0%,#0f2a1c,#060b12 70%);color:#d7ffe9;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;user-select:none}
  .wrap{width:100%;max-width:520px;display:flex;flex-direction:column;gap:10px}
  .hud{display:flex;align-items:center;gap:8px;font-size:13px;color:#7fd6a8}
  .stat{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);
    padding:6px 12px;border-radius:10px;white-space:nowrap}
  .stat b{color:#eafff3;font-size:15px;margin-left:3px}
  .hud button{margin-left:auto;background:rgba(34,197,94,.18);border:1px solid rgba(34,197,94,.4);
    color:#c9ffdf;border-radius:10px;padding:7px 16px;cursor:pointer;font:inherit;font-size:13px}
  .hud button:active{transform:scale(.96)}
  .stage{position:relative;width:100%;aspect-ratio:1;border-radius:14px;overflow:hidden;
    background:#08130d;border:1px solid rgba(34,197,94,.35);
    box-shadow:0 0 40px rgba(34,197,94,.18) inset,0 10px 30px rgba(0,0,0,.5);touch-action:none}
  canvas{display:block;width:100%;height:100%}
  .overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:12px;background:rgba(6,14,10,.86);text-align:center;padding:18px}
  .overlay.on{display:flex}
  .overlay h2{margin:0;font-size:26px;color:#c9ffdf}
  .overlay p{margin:0;color:#7fd6a8;font-size:14px;line-height:1.7}
  .overlay .btn{background:linear-gradient(135deg,#22c55e,#15803d);border:0;color:#fff;
    font-weight:700;padding:11px 26px;border-radius:10px;cursor:pointer;font-size:15px;font-family:inherit}
  .dpad{display:none;grid-template-columns:repeat(3,1fr);gap:8px;max-width:230px;
    margin:0 auto;width:100%}
  .dpad button{aspect-ratio:1;background:rgba(34,197,94,.14);border:1px solid rgba(34,197,94,.35);
    border-radius:12px;color:#c9ffdf;font-size:20px;cursor:pointer}
  .dpad button:active{background:rgba(34,197,94,.34)}
  .dpad .sp{visibility:hidden}
  @media (pointer:coarse){ .dpad{display:grid} }
  @media (max-height:760px) and (pointer:coarse){ .wrap{max-width:340px} }
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="stat">得分<b id="score">0</b></div>
    <div class="stat">最高<b id="best">0</b></div>
    <div class="stat">长度<b id="len">3</b></div>
    <button id="pauseBtn" type="button">暂停</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">准备好了吗？</h2>
      <p id="ovText">方向键 / WASD 控制方向<br>吃掉果实变长，别撞墙也别咬到自己</p>
      <button class="btn" id="ovBtn" type="button">开始游戏</button>
    </div>
  </div>
  <div class="dpad" id="dpad">
    <button class="sp" tabindex="-1"></button>
    <button data-dir="0" type="button">▲</button>
    <button class="sp" tabindex="-1"></button>
    <button data-dir="3" type="button">◀</button>
    <button data-dir="2" type="button">▼</button>
    <button data-dir="1" type="button">▶</button>
  </div>
</div>
<script>
(function () {
  'use strict';
  var N = 20;
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var lenEl = document.getElementById('len');
  var ov = document.getElementById('ov');
  var ovTitle = document.getElementById('ovTitle');
  var ovText = document.getElementById('ovText');
  var ovBtn = document.getElementById('ovBtn');
  var pauseBtn = document.getElementById('pauseBtn');

  var snake, dir, queue, food, score, best, step, acc, last, running, dead, paused, cell;

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function readBest() { var b = parseInt(store('snake.best'), 10); return isNaN(b) ? 0 : b; }

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = cv.clientWidth, h = cv.clientHeight;
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = w / N;
  }
  window.addEventListener('resize', resize);

  function reset() {
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    dir = 1; queue = [];
    score = 0; step = 150; acc = 0; last = 0;
    dead = false; paused = false;
    best = readBest();
    placeFood();
    updateHud();
  }

  function placeFood() {
    var free = [];
    for (var x = 0; x < N; x++) for (var y = 0; y < N; y++) {
      var hit = false;
      for (var i = 0; i < snake.length; i++) if (snake[i].x === x && snake[i].y === y) { hit = true; break; }
      if (!hit) free.push({ x: x, y: y });
    }
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function updateHud() {
    scoreEl.textContent = score;
    lenEl.textContent = snake.length;
    if (score > best) { best = score; store('snake.best', String(best)); }
    bestEl.textContent = best;
  }

  function turn(d) {
    var cur = queue.length ? queue[queue.length - 1] : dir;
    if ((cur + 2) % 4 === d || cur === d) return;
    if (queue.length < 3) queue.push(d);
  }

  function tick() {
    if (queue.length) dir = queue.shift();
    var v = [{ x: 0, y: -1 }, { x: 1, y: 0 }, { x: 0, y: 1 }, { x: -1, y: 0 }][dir];
    var head = { x: snake[0].x + v.x, y: snake[0].y + v.y };

    if (head.x < 0 || head.x >= N || head.y < 0 || head.y >= N) return gameOver('撞到墙了');
    for (var i = 0; i < snake.length - 1; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) return gameOver('咬到自己了');
    }

    snake.unshift(head);
    if (food && head.x === food.x && head.y === food.y) {
      score += 1;
      step = Math.max(68, 150 - Math.floor(score / 3) * 6);
      placeFood();
    } else {
      snake.pop();
    }
    updateHud();
  }

  function gameOver(reason) {
    dead = true;
    ovTitle.textContent = '游戏结束';
    ovText.innerHTML = reason + '<br>本局得分 <b>' + score + '</b> · 长度 ' + snake.length;
    ovBtn.textContent = '再来一局';
    ov.classList.add('on');
  }

  function roundRect(x, y, w, h, r) {
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  var pulse = 0;
  function draw() {
    var w = cv.clientWidth, h = cv.clientHeight;
    ctx.clearRect(0, 0, w, h);

    // 网格
    ctx.strokeStyle = 'rgba(34,197,94,.09)';
    ctx.lineWidth = 1;
    for (var i = 1; i < N; i++) {
      ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(w, i * cell); ctx.stroke();
    }

    // 果实
    if (food) {
      pulse += 0.09;
      var r = cell * (0.30 + Math.sin(pulse) * 0.05);
      var cx = food.x * cell + cell / 2, cy = food.y * cell + cell / 2;
      var grd = ctx.createRadialGradient(cx, cy, 1, cx, cy, cell * 0.9);
      grd.addColorStop(0, 'rgba(255,120,90,.75)');
      grd.addColorStop(1, 'rgba(255,80,60,0)');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(cx, cy, cell * 0.9, 0, 6.284); ctx.fill();
      ctx.fillStyle = '#ff5a4d';
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.284); ctx.fill();
    }

    // 蛇身
    var pad = Math.max(1.5, cell * 0.09);
    for (var s = snake.length - 1; s >= 0; s--) {
      var seg = snake[s];
      var t = s / Math.max(1, snake.length - 1);
      var g = Math.round(210 - t * 90);
      ctx.fillStyle = s === 0 ? '#7dffb0' : 'rgb(' + Math.round(34 + t * 10) + ',' + g + ',' + Math.round(94 - t * 30) + ')';
      ctx.shadowColor = s === 0 ? 'rgba(125,255,176,.9)' : 'rgba(34,197,94,.35)';
      ctx.shadowBlur = s === 0 ? 16 : 5;
      roundRect(seg.x * cell + pad, seg.y * cell + pad, cell - pad * 2, cell - pad * 2, cell * 0.28);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // 眼睛
    var hd = snake[0];
    var v = [{ x: 0, y: -1 }, { x: 1, y: 0 }, { x: 0, y: 1 }, { x: -1, y: 0 }][dir];
    var ex = hd.x * cell + cell / 2, ey = hd.y * cell + cell / 2;
    var off = cell * 0.19;
    ctx.fillStyle = '#08331d';
    [-1, 1].forEach(function (k) {
      ctx.beginPath();
      ctx.arc(ex + v.x * off * 0.8 - v.y * off * k, ey + v.y * off * 0.8 + v.x * off * k, cell * 0.09, 0, 6.284);
      ctx.fill();
    });
  }

  function loop(ts) {
    if (!last) last = ts;
    var dt = ts - last; last = ts;
    if (running && !dead && !paused) {
      acc += dt;
      var guard = 0;
      while (acc >= step && guard++ < 5) { acc -= step; tick(); }
    }
    draw();
    requestAnimationFrame(loop);
  }

  function start() {
    reset();
    running = true;
    ov.classList.remove('on');
    pauseBtn.textContent = '暂停';
  }

  var KEYS = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3, w: 0, d: 1, s: 2, a: 3, W: 0, D: 1, S: 2, A: 3 };
  document.addEventListener('keydown', function (e) {
    if (e.key === ' ') { e.preventDefault(); togglePause(); return; }
    if (!(e.key in KEYS)) return;
    e.preventDefault();
    turn(KEYS[e.key]);
  });

  function togglePause() {
    if (dead || !running) return;
    paused = !paused;
    pauseBtn.textContent = paused ? '继续' : '暂停';
    if (paused) { ovTitle.textContent = '已暂停'; ovText.textContent = '点击继续或按空格恢复'; ovBtn.textContent = '继续游戏'; ov.classList.add('on'); }
    else ov.classList.remove('on');
  }

  pauseBtn.addEventListener('click', togglePause);
  ovBtn.addEventListener('click', function () {
    if (paused) { togglePause(); return; }
    start();
  });

  document.getElementById('dpad').addEventListener('click', function (e) {
    var b = e.target.closest('[data-dir]');
    if (b) turn(Number(b.dataset.dir));
  });

  var sx = 0, sy = 0, tracking = false;
  var stage = document.getElementById('stage');
  stage.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true;
  }, { passive: true });
  stage.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  stage.addEventListener('touchend', function (e) {
    if (!tracking) return;
    tracking = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
  }, { passive: true });

  reset();
  running = false;
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
