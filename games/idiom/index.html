<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b14">
<title>成语猜猜 · 小游戏</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:radial-gradient(circle at 50% 0%,#083344,#050b14 72%);
    color:#dbf8ff;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:min(100%,900px);margin:0 auto;padding:12px 12px 26px;display:flex;flex-direction:column;gap:9px}
  h1{margin:2px 0 0;text-align:center;font-size:clamp(21px,5.4vw,34px);letter-spacing:.16em;
     color:#e9feff;text-shadow:0 0 20px rgba(6,182,212,.55)}
  .hint{margin:0;text-align:center;font-size:12.5px;line-height:1.65;color:#7fd7e8}
  .hint b{color:#a7f3ff;font-weight:600}
  .bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
  .mbtn{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid rgba(6,182,212,.35);
        background:rgba(6,182,212,.10);color:#bff2ff;font-size:13px;font-family:inherit;
        cursor:pointer;touch-action:manipulation}
  .mbtn.on{background:linear-gradient(135deg,#06b6d4,#0ea5e9);color:#04202b;border-color:#67e8f9;font-weight:700}
  .date{font-size:12px;color:#67e8f9;opacity:.85}
  .stats{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  .stat{flex:1 1 0;min-width:70px;max-width:130px;text-align:center;padding:6px 4px;border-radius:10px;
        background:rgba(6,182,212,.13);border:1px solid rgba(6,182,212,.35)}
  .stat b{display:block;font-size:17px;color:#eafcff;line-height:1.25}
  .stat span{font-size:11px;color:#7fd7e8}
  .board{display:grid;grid-template-rows:repeat(6,auto);gap:6px;
         width:min(100%,420px,max(230px,calc((100vh - 330px)*0.6667)));margin:2px auto}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .tile{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;
        font-size:clamp(19px,7.6vw,33px);font-weight:600;color:#eafcff;
        background:rgba(6,182,212,.07);border:1.5px solid rgba(6,182,212,.26);
        transition:background .18s,border-color .18s,color .18s}

                box-shadow:0 0 14px rgba(6,182,212,.28) inset}
  .tile.g{background:linear-gradient(160deg,#10b981,#059669);border-color:#34d399;color:#02251a}
  .tile.y{background:linear-gradient(160deg,#f59e0b,#d97706);border-color:#fbbf24;color:#2a1802}
  .tile.x{background:rgba(100,116,139,.34);border-color:rgba(148,163,184,.32);color:#9fb3c8}
  @keyframes pop{0%{transform:scale(.84)}62%{transform:scale(1.07)}100%{transform:scale(1)}}
  .tile.pop{animation:pop .3s ease both}
  .msg{min-height:19px;text-align:center;font-size:13px;color:#67e8f9;transition:color .2s}
  .msg.bad{color:#fca5a5}
  .typebar{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:stretch}
  .typebox{min-height:44px;border-radius:10px;padding:0 12px;font-size:18px;font-family:inherit;
           background:rgba(3,18,28,.85);color:#eafcff;border:1.5px solid rgba(6,182,212,.45);outline:none;width:100%}
  .typebox:focus{border-color:#67e8f9;box-shadow:0 0 0 2px rgba(6,182,212,.22)}
  .typebox::placeholder{color:#4d8b9c;font-size:13px}
  .btn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid rgba(6,182,212,.4);
       background:rgba(6,182,212,.14);color:#e6feff;font-size:15px;font-family:inherit;
       cursor:pointer;touch-action:manipulation}
  .btn.primary{background:linear-gradient(135deg,#06b6d4,#0ea5e9);color:#04202b;font-weight:700;border-color:#67e8f9}
  .btn.pressed{filter:brightness(1.25)}
  .panel{background:rgba(6,182,212,.07);border:1px solid rgba(6,182,212,.25);border-radius:12px;padding:8px 9px 10px}
  .phead{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:#7fd7e8;margin:2px 0 6px}
  .phead b{color:#a7f3ff;font-weight:600;font-size:12.5px}
  .chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(46px,1fr));gap:6px}
  .words{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .chip{min-height:44px;display:flex;align-items:center;justify-content:center;padding:0 10px;
        border-radius:9px;font-size:19px;font-family:inherit;letter-spacing:.06em;cursor:pointer;
        background:rgba(14,165,233,.13);border:1px solid rgba(6,182,212,.36);color:#e6feff;touch-action:manipulation}
  .chip.wide{font-size:16px;letter-spacing:.1em;min-height:40px}
  .chip:active,.chip.pressed{background:rgba(6,182,212,.4)}
  .none{font-size:12.5px;color:#5b8fa0;padding:6px 2px}
  .tools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  @keyframes shake{10%,90%{transform:translateX(-3px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-2px)}}
  .board.shake{animation:shake .34s ease}
  .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:14px;z-index:30;
           background:rgba(2,7,14,.74);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .overlay.on{display:flex}
  .card{width:100%;max-width:min(100%,400px);max-height:92vh;overflow:auto;text-align:center;
        background:rgba(5,17,28,.97);border:1px solid rgba(6,182,212,.42);border-radius:16px;padding:18px 16px 16px;
        box-shadow:0 22px 60px rgba(0,0,0,.55)}
  .card h2{margin:0 0 8px;font-size:20px;color:#a7f3ff;letter-spacing:.08em}
  .answer{font-size:clamp(23px,7vw,32px);letter-spacing:.22em;color:#eafcff;font-weight:700;text-shadow:0 0 18px rgba(6,182,212,.5)}
  .mean{margin:8px 0 12px;font-size:13.5px;line-height:1.7;color:#bde9f5}
  .dist{margin:0 0 14px;display:flex;flex-direction:column;gap:3px}
  .drow{display:grid;grid-template-columns:16px 1fr 24px;gap:6px;align-items:center;font-size:12px;color:#7fd7e8}
  .dbar{height:12px;border-radius:6px;background:rgba(6,182,212,.14);overflow:hidden}
  .dbar i{display:block;height:100%;background:linear-gradient(90deg,#0891b2,#22d3ee);border-radius:6px}
  .drow.hi .dbar i{background:linear-gradient(90deg,#10b981,#34d399)}
  .drow.hi{color:#a7f3ff;font-weight:700}
  .tips{font-size:12px;color:#6fb3c4;margin-top:10px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <h1>成语猜猜</h1>
  <p class="hint">六个机会猜一句四字成语 · 用<b>中文输入法</b>键入四字后按回车，或点下方<b>候选字 / 候选成语</b>拼出来<br>绿 = 字与位置都对 · 黄 = 字在答案里但位置不对 · 灰 = 答案里没有这个字</p>

  <div class="bar">
    <button class="mbtn on" id="mDaily" type="button" data-act="mode" data-val="daily">每日一题</button>
    <button class="mbtn" id="mEndless" type="button" data-act="mode" data-val="endless">无限模式</button>
    <span class="date" id="dateTag"></span>
  </div>

  <div class="stats">
    <div class="stat"><b id="sLeft">6</b><span>剩余机会</span></div>
    <div class="stat"><b id="sScore">0</b><span>得分</span></div>
    <div class="stat"><b id="sStreak">0</b><span>连胜</span></div>
    <div class="stat"><b id="sRate">0%</b><span>胜率</span></div>
  </div>

  <div class="board" id="board" aria-label="猜成语棋盘"></div>
  <div class="msg" id="msg" aria-live="polite"></div>

  <div class="typebar">
    <input id="typebox" class="typebox" type="text" inputmode="text" autocomplete="off"
           autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done"
           placeholder="点这里，用中文输入法打四字成语" aria-label="输入四字成语">
    <button class="btn primary" type="button" data-act="submit">提交</button>
    <button class="btn" type="button" data-act="del">删字</button>
  </div>

  <div class="panel">
    <div class="phead"><b>候选字</b><span id="prefixTag">（未输入）</span></div>
    <div class="chars" id="chars"></div>
    <div class="phead" style="margin-top:9px"><b>候选成语</b><span id="wordTag">输入两个字后开始补全</span></div>
    <div class="words" id="words"></div>
  </div>

  <div class="tools">
    <button class="btn" type="button" data-act="again" id="again">重新开始</button>
    <button class="btn" type="button" data-act="next" id="next">换一题</button>
  </div>
</div>

<div class="overlay" id="ov">
  <div class="card">
    <h2 id="ovTitle">猜对了！</h2>
    <div class="answer" id="ovWord"></div>
    <p class="mean" id="ovMean"></p>
    <div class="dist" id="ovDist"></div>
    <button class="btn primary" type="button" data-act="ovbtn" id="ovBtn">再来一局</button>
    <div class="tips" id="ovTips"></div>
  </div>
</div>

<script>window.GAMEPAD = { mode: 'pointer' };</script>
<script src="/static/js/gamepad.js"></script>

      if (p < 1) continue;
      var w = s.slice(0, p).replace(/^\s+|\s+$/g, '');
      var m = s.slice(p + 1).replace(/^\s+|\s+$/g, '');
      if (!/^[\u4e00-\u9fa5]{4}$/.test(w)) continue;
      if (Object.prototype.hasOwnProperty.call(MAP, w)) continue;
      MAP[w] = m;
      BANK.push({ w: w, m: m });
    }
    for (var k = 0; k < BANK.length; k++) {
      var word = BANK[k].w;
      FIRST[word.charAt(0)] = (FIRST[word.charAt(0)] || 0) + 1;
      for (var n = 1; n <= 3; n++) {
        var pre = word.slice(0, n), nx = word.charAt(n);
        if (!NEXT[pre]) NEXT[pre] = {};
        NEXT[pre][nx] = (NEXT[pre][nx] || 0) + 1;
      }
      for (var q = 2; q <= 4; q++) {
        var pw = word.slice(0, q);
        if (!WORDS[pw]) WORDS[pw] = [];
        WORDS[pw].push(word);
      }
    }
  })();

  /* ---------- 2. 确定性随机：mulberry32 + FNV-1a ---------- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashStr(s) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return h >>> 0;
  }

  /* ---------- 3. URL 参数：?seed=<整数> / ?daily=YYYY-MM-DD ---------- */
  var Q = new URLSearchParams(location.search);
  var rawSeed = Q.get('seed'), rawDaily = Q.get('daily');
  var SEED = (rawSeed !== null && /^-?\d+$/.test(rawSeed)) ? parseInt(rawSeed, 10) : null;
  var DATE = (rawDaily && /^\d{4}-\d{2}-\d{2}$/.test(rawDaily)) ? rawDaily : null;
  var BASE = SEED !== null ? (SEED >>> 0)
           : DATE ? (hashStr('idiom:' + DATE) % 2147483647)
           : ((Math.random() * 2147483647) | 0);
  var MAX_TRIES = 6;

  function wordAt(no) {
    var r = mulberry32(BASE), idx = 0;
    for (var i = 0; i <= Math.max(0, no | 0); i++) idx = Math.floor(r() * BANK.length);
    return BANK[idx];
  }

  /* ---------- 4. 状态 + 本地战绩 ---------- */
  var KEY_STATS = 'idiom-stats', KEY_DAILY = 'idiom-daily-';
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function loadStats() {
    var d = { played: 0, wins: 0, streak: 0, max: 0, dist: [0, 0, 0, 0, 0, 0] };
    var raw = lsGet(KEY_STATS);
    if (raw) {
      try {
        var o = JSON.parse(raw);
        if (o && typeof o === 'object') {
          d.played = o.played | 0; d.wins = o.wins | 0; d.streak = o.streak | 0; d.max = o.max | 0;
          if (o.dist && o.dist.length === 6) { for (var i = 0; i < 6; i++) d.dist[i] = o.dist[i] | 0; }
        }
      } catch (e) {}
    }
    return d;
  }
  function loadDaily() {
    if (!DATE) return null;
    var raw = lsGet(KEY_DAILY + DATE);
    if (!raw) return null;
    try { var o = JSON.parse(raw); return (o && o.done) ? o : null; } catch (e) { return null; }
  }
  function saveDaily(rec) { if (DATE) lsSet(KEY_DAILY + DATE, JSON.stringify(rec)); }

  var STATS = loadStats();
  var ST = {
    mode: DATE ? 'daily' : 'endless',
    daily: DATE, no: 0, eno: 0,
    over: false, won: false, score: 0, attempts: 0,
    rows: [], guess: [], counted: false, posted: false, replay: false
  };
  var ANSWER = '', MEANING = '';

  /* ---------- 5. DOM ---------- */
  function $(id) { return document.getElementById(id); }
  var boardEl = $('board'), msgEl = $('msg'), box = $('typebox'), ov = $('ov');
  var ovTitle = $('ovTitle'), ovWord = $('ovWord'), ovMean = $('ovMean'), ovDist = $('ovDist'), ovBtn = $('ovBtn'), ovTips = $('ovTips');
  var charsEl = $('chars'), wordsEl = $('words'), prefixTag = $('prefixTag'), wordTag = $('wordTag');
  var sLeft = $('sLeft'), sScore = $('sScore'), sStreak = $('sStreak'), sRate = $('sRate');
  var mDaily = $('mDaily'), mEndless = $('mEndless'), dateTag = $('dateTag');

  var msgTimer = 0;
  function toast(t, bad) {
    msgEl.textContent = t;
    msgEl.className = bad ? 'msg bad' : 'msg';
    if (msgTimer) clearTimeout(msgTimer);
    msgTimer = setTimeout(function () { msgEl.textContent = ''; msgEl.className = 'msg'; }, 2800);
  }
  function shake() {
    boardEl.classList.remove('shake');
    void boardEl.offsetWidth;
    boardEl.classList.add('shake');
    setTimeout(function () { boardEl.classList.remove('shake'); }, 420);
  }
  function hideOverlay() { ov.classList.remove('on'); }

  /* ---------- 6. 渲染 ---------- */
  function renderBoard(animRow) {
    var html = '', r, c, ch, cls, row, extra;
    for (r = 0; r < MAX_TRIES; r++) {
      html += '<div class="row">';
      row = ST.rows[r];
      for (c = 0; c < 4; c++) {
        if (row) { ch = row.word.charAt(c); cls = 'tile ' + row.marks[c]; }
        else if (r === ST.rows.length && ST.guess[c]) { ch = ST.guess[c]; cls = 'tile filled'; }
        else { ch = ''; cls = 'tile'; }
        extra = (animRow === r) ? ' pop' : '';
        html += '<div class="' + cls + extra + '" style="animation-delay:' + (c * 85) + 'ms">' + ch + '</div>';
      }
      html += '</div>';
    }
    boardEl.innerHTML = html;
  }
  function renderStats() {
    sLeft.textContent = String(Math.max(0, MAX_TRIES - ST.attempts));
    sScore.textContent = String(ST.score);
    sStreak.textContent = String(STATS.streak);
    sRate.textContent = (STATS.played ? Math.round(STATS.wins / STATS.played * 100) : 0) + '%';
  }
  function chipHTML(label, act, val, wide) {
    return '<button type="button" class="chip' + (wide ? ' wide' : '') +
           '" data-act="' + act + '" data-val="' + val + '">' + label + '</button>';
  }
  function byCount(d) {
    return Object.keys(d).sort(function (a, b) { return (d[b] - d[a]) || (a < b ? -1 : 1); });
  }
  function renderPanel() {
    var g = ST.guess.join(''), n = g.length, i, keys, html = '';
    if (n === 0) {
      prefixTag.textContent = '（未输入）· 点下面的字开头';
      keys = byCount(FIRST).slice(0, 12);
      for (i = 0; i < keys.length; i++) html += chipHTML(keys[i], 'ch', keys[i]);
    } else {
      prefixTag.textContent = '已输入「' + g + '」· 再点一个字或直接键入';
      keys = byCount(NEXT[g] || {}).slice(0, 12);
      if (!keys.length) html = '<div class="none">词库里没有以「' + g + '」开头的成语，点「删字」退一格</div>';
      else for (i = 0; i < keys.length; i++) html += chipHTML(keys[i], 'ch', keys[i]);
    }
    charsEl.innerHTML = html;

    var pool = [], used = {};
    for (i = 0; i < ST.rows.length; i++) used[ST.rows[i].word] = 1;
    if (n >= 2 && n <= 3) {
      var all = WORDS[g] || [];
      for (i = 0; i < all.length && pool.length < 6; i++) if (!used[all[i]]) pool.push(all[i]);
    }
    var wHTML = '';
    for (i = 0; i < pool.length; i++) wHTML += chipHTML(pool[i], 'word', pool[i], true);
    wordsEl.innerHTML = wHTML || '<div class="none">' + (n < 2 ? '输入两个字后开始补全成语' : '没有匹配的成语') + '</div>';
    wordTag.textContent = pool.length ? ('前缀「' + g + '」的成语 · 点一下整句填入') : (n < 2 ? '输入两个字后开始补全' : '暂无匹配');
  }
  function distHTML() {
    var html = '', max = 1, i;
    for (i = 0; i < 6; i++) if (STATS.dist[i] > max) max = STATS.dist[i];
    for (i = 0; i < 6; i++) {
      var pct = Math.round(STATS.dist[i] / max * 100);
      var hi = (ST.won && ST.attempts === i + 1) ? ' hi' : '';
      html += '<div class="drow' + hi + '"><span>' + (i + 1) + '</span>' +
              '<span class="dbar"><i style="width:' + pct + '%"></i></span>' +
              '<span>' + STATS.dist[i] + '</span></div>';
    }
    return html;
  }
  function renderAll() {
    renderBoard(-1); renderPanel(); renderStats();
    mDaily.classList.toggle('on', ST.mode === 'daily');
    mEndless.classList.toggle('on', ST.mode !== 'daily');
    dateTag.textContent = DATE ? ('每日一题 · ' + DATE)
                       : (SEED !== null ? ('练习 · seed ' + SEED) : '随机出题');
  }

  /* ---------- 7. 判定（Wordle 双遍：先绿，再黄，其余灰） ---------- */
  function judge(g, a) {
    var marks = ['x', 'x', 'x', 'x'], used = [false, false, false, false], i, j;
    for (i = 0; i < 4; i++) if (g.charAt(i) === a.charAt(i)) { marks[i] = 'g'; used[i] = true; }
    for (i = 0; i < 4; i++) {
      if (marks[i] === 'g') continue;
      for (j = 0; j < 4; j++) {
        if (used[j]) continue;
        if (g.charAt(i) === a.charAt(j)) { marks[i] = 'y'; used[j] = true; break; }
      }
    }
    return marks;
  }

  /* ---------- 8. 流程 ---------- */
  function resetRun() {
    ST.rows = []; ST.guess = [];
    ST.attempts = 0; ST.over = false; ST.won = false; ST.score = 0;
  }
  function setPuzzle(no) {
    var it = wordAt(no);
    ST.no = no;
    ANSWER = it ? it.w : '';
    MEANING = it ? it.m : '';
  }
  function syncURL() {
    try {
      var url = new URL(location.href);
      if (ST.mode === 'daily' && DATE) url.searchParams.set('daily', DATE); else url.searchParams.delete('daily');
      if (SEED !== null) url.searchParams.set('seed', String(SEED)); else url.searchParams.delete('seed');
      history.replaceState(null, '', url.pathname + (url.search || '') + (url.hash || ''));
    } catch (e) {}
  }
  function pushChar(ch) {
    if (ST.over) { toast('本题已经结束，点「换一题」继续', true); return; }
    if (!/^[\u4e00-\u9fa5]$/.test(ch)) return;
    if (ST.guess.length >= 4) { toast('已经四个字了，按回车或点「提交」', true); shake(); return; }
    ST.guess.push(ch);
    renderBoard(-1); renderPanel();
  }
  function popChar() {
    if (ST.over) { toast('本题已经结束', true); return; }
    if (!ST.guess.length) { toast('还没输入字'); return; }
    ST.guess.pop();
    renderBoard(-1); renderPanel();
  }
  function setGuess(w) {
    if (ST.over) { toast('本题已经结束', true); return; }
    ST.guess = w.slice(0, 4).split('');
    renderBoard(-1); renderPanel();
  }
  function hintText(marks) {
    var gN = 0, yN = 0, i;
    for (i = 0; i < 4; i++) { if (marks[i] === 'g') gN++; else if (marks[i] === 'y') yN++; }
    return '第 ' + ST.attempts + ' 次：' + gN + ' 个字位置对、' + yN + ' 个字位置不对 · 还剩 ' + Math.max(0, MAX_TRIES - ST.attempts) + ' 次';
  }
  function submit() {
    if (ST.over) { toast('本题已经结束，点「换一题」继续', true); return; }
    var g = ST.guess.join('');
    if (g.length !== 4) { toast('还差 ' + (4 - g.length) + ' 个字', true); shake(); return; }
    if (!Object.prototype.hasOwnProperty.call(MAP, g)) { toast('词库里没有「' + g + '」，试试下面候选里的成语', true); shake(); return; }
    var marks = judge(g, ANSWER);
    ST.rows.push({ word: g, marks: marks });
    ST.attempts++;
    ST.guess = [];
    renderBoard(ST.rows.length - 1); renderPanel(); renderStats();
    if (g === ANSWER) { box.value = ''; finish(true); return; }
    if (ST.attempts >= MAX_TRIES) { box.value = ''; finish(false); return; }
    box.value = '';
    toast(hintText(marks));
    try { box.focus({ preventScroll: true }); } catch (e) { try { box.focus(); } catch (e2) {} }
  }
  function finish(won) {
    if (ST.over) return;
    ST.over = true; ST.won = !!won;
    ST.score = ST.won ? Math.round((MAX_TRIES + 1 - ST.attempts) / MAX_TRIES * 100) : 0;
    if (!ST.counted) {
      ST.counted = true;
      STATS.played++;
      if (ST.won) {
        STATS.wins++; STATS.streak++;
        if (STATS.streak > STATS.max) STATS.max = STATS.streak;
        if (ST.attempts >= 1 && ST.attempts <= MAX_TRIES) STATS.dist[ST.attempts - 1]++;
      } else { STATS.streak = 0; }
      lsSet(KEY_STATS, JSON.stringify(STATS));
      if (ST.mode === 'daily' && DATE) saveDaily({ done: true, won: ST.won, tries: ST.attempts, word: ANSWER, score: ST.score });
      if (ST.won && ST.mode === 'daily' && DATE && !ST.posted) {
        ST.posted = true;
        try { window.parent.postMessage({ type: 'gs:daily-done', game: 'idiom', date: DATE, score: ST.score }, '*'); } catch (e) {}
      }
    }
    renderStats(); renderPanel();
    box.disabled = true;
    setTimeout(function () { if (ST.over) showEnd(); }, 760);
  }
  function showEnd() {
    ovTitle.textContent = ST.won ? (ST.mode === 'daily' ? '今日一题 · 猜对了！' : '猜对了！') : '机会用完了';
    ovWord.textContent = ANSWER;
    ovMean.textContent = MEANING;
    ovDist.innerHTML = distHTML();
    ovTips.textContent = ST.won
      ? ('用了 ' + ST.attempts + ' 次 · 得分 ' + ST.score + ' · 连胜 ' + STATS.streak)
      : '答案是上面这句成语，记下来，下次遇到就是熟人了。';
    ovBtn.textContent = ST.mode === 'daily' ? '去无限模式再来' : '下一题';
    ov.classList.add('on');
  }
  function applyDailyRecord(rec) {
    ST.over = true; ST.won = !!rec.won;
    ST.attempts = rec.tries | 0; ST.score = rec.score | 0;
    ST.counted = true; ST.posted = true; ST.replay = true;
    renderAll();
    ovTitle.textContent = '今日已完成';
    ovWord.textContent = ANSWER;
    ovMean.textContent = MEANING;
    ovDist.innerHTML = distHTML();
    ovTips.textContent = (rec.won ? '今天第 ' + (rec.tries | 0) + ' 次就猜对了' : '今天的题目已经答过了') + ' · 明天再来，或切到无限模式接着练。';
    ovBtn.textContent = '去无限模式再来';
    ov.classList.add('on');
    box.disabled = true;
  }
  function nextPuzzle() {
    if (ST.mode === 'daily') { toast('每日一题只有一道，切到「无限模式」可以继续练'); return; }
    ST.eno = (ST.eno | 0) + 1;
    setPuzzle(ST.eno);
    resetRun();
    ST.counted = false; ST.posted = false; ST.replay = false;
    box.disabled = false;
    hideOverlay(); renderAll();
    toast('换了一道新的成语');
  }
  function doRestart() {
    resetRun();
    hideOverlay();
    box.disabled = false;
    renderAll();
    toast('已重置本题：还是同一个成语，六个机会重来');
  }
  function setMode(m) {
    if (m !== 'daily' && m !== 'endless') return;
    if (m === 'daily' && !DATE) { toast('每日一题要用 ?daily=YYYY-MM-DD 打开', true); return; }
    if (m === ST.mode) return;
    ST.mode = m;
    hideOverlay();
    box.value = '';
    box.disabled = false;
    ST.counted = false; ST.posted = false; ST.replay = false;
    if (m === 'daily') {
      setPuzzle(0); resetRun(); renderAll();
      var rec = loadDaily();
      if (rec) applyDailyRecord(rec);
      else { toast('回到今天的「每日一题」· ' + DATE); try { box.focus({ preventScroll: true }); } catch (e) {} }
    } else {
      setPuzzle(ST.eno | 0); resetRun(); renderAll();
      toast('无限模式 · 点「换一题」换一个成语');
    }
    syncURL();
  }
  function onOvBtn() {
    hideOverlay();
    if (ST.mode === 'daily') { setMode('endless'); nextPuzzle(); }
    else nextPuzzle();
  }

  /* ---------- 9. 输入：中文输入法 / 候选字 / 键盘 ---------- */
  function harvest(text) {
    if (!text || ST.over) return;
    var added = 0, i, ch;
    for (i = 0; i < text.length && ST.guess.length < 4; i++) {
      ch = text.charAt(i);
      if (/[\u4e00-\u9fa5]/.test(ch)) { ST.guess.push(ch); added++; }
    }
    if (added) { box.value = ''; renderBoard(-1); renderPanel(); }
  }
  box.addEventListener('input', function () { harvest(box.value); });
  box.addEventListener('compositionend', function () { harvest(box.value); });

  function handleEl(el) {
    var act = el.getAttribute('data-act'), val = el.getAttribute('data-val') || '';
    if (act === 'mode') setMode(val);
    else if (act === 'ch') pushChar(val);
    else if (act === 'word') setGuess(val);
    else if (act === 'submit') submit();
    else if (act === 'del') popChar();
    else if (act === 'again') doRestart();
    else if (act === 'next') nextPuzzle();
    else if (act === 'ovbtn') onOvBtn();
  }
  function flash(el) {
    el.classList.add('pressed');
    setTimeout(function () { el.classList.remove('pressed'); }, 130);
  }
  var lastAct = 0;
  function findAct(e) {
    var t = e.target;
    if (!t || !t.closest) return null;
    return t.closest('[data-act]');
  }
  document.addEventListener('pointerdown', function (e) {
    var el = findAct(e);
    if (!el) return;
    lastAct = Date.now();
    if (e.cancelable) e.preventDefault();
    flash(el);
    handleEl(el);
  }, { passive: false });
  document.addEventListener('click', function (e) {
    var el = findAct(e);
    if (!el) return;
    if (Date.now() - lastAct < 900) { if (e.cancelable) e.preventDefault(); return; }
    flash(el);
    handleEl(el);
  });
  document.addEventListener('keydown', function (e) {
    var inBox = e.target === box;
    if (e.key === 'Enter') {
      if (e.isComposing || e.keyCode === 229) return;
      e.preventDefault();
      submit();
    } else if (e.key === 'Backspace') {
      if (!inBox || !box.value) { e.preventDefault(); popChar(); }
    } else if (e.key === 'Escape') {
      hideOverlay();
    }
  });

  /* ---------- 10. 调试句柄 ---------- */
  window.GAME = {
    slug: 'idiom',
    state: function () {
      var g = ST.guess.join('');
      return {
        slug: 'idiom', mode: ST.mode, daily: ST.daily, seed: SEED, baseSeed: BASE,
        over: !!ST.over, won: !!ST.won, score: ST.score,
        attempts: ST.attempts, maxAttempts: MAX_TRIES,
        guess: g, prefix: g.slice(0, 2),
        rows: ST.rows.map(function (r) { return { word: r.word, marks: r.marks.slice() }; }),
        answer: ST.over ? ANSWER : '', meaning: ST.over ? MEANING : '',
        streak: STATS.streak, played: STATS.played, wins: STATS.wins,
        bankSize: BANK.length, puzzle: ST.no, replay: !!ST.replay, posted: !!ST.posted,
        dailyDone: !!loadDaily()
      };
    },
    restart: function () { doRestart(); return window.GAME.state(); },
    seed: function () { return SEED === null ? null : SEED; }
  };

  /* ---------- 11. 启动 ---------- */
  (function boot() {
    if (ST.mode === 'daily') {
      setPuzzle(0); resetRun(); renderAll();
      var rec = loadDaily();
      if (rec) applyDailyRecord(rec);
      else toast('每日一题 · ' + DATE + ' · 六个机会猜一句成语');
    } else {
      setPuzzle(0); resetRun(); renderAll();
      toast(SEED !== null ? ('练习模式 · seed ' + SEED) : '无限模式 · 六个机会猜一句成语');
    }
    syncURL();
    var n = BANK.length;
    if (n < 300) toast('词库只有 ' + n + ' 条，可能解析出错', true);
  })();
})();
</script>
</body>
</html>
